<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Demande envoyée — MS Custom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --noir:#050609; --blanc:#F4F6F9; --gris:#8B929F;
  --seam:linear-gradient(90deg,#2F6BFF,#8B5CF6,#E0409B);
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100svh; background:var(--noir); color:var(--blanc);
  font-family:'Inter Tight',system-ui,sans-serif; line-height:1.65;
  display:grid; place-items:center; padding:32px; text-align:center;
  background-image:
    radial-gradient(90% 60% at 50% 0%, rgba(139,92,246,.18), transparent 60%),
    radial-gradient(70% 50% at 50% 100%, rgba(47,107,255,.12), transparent 65%);
}
.mark{width:9px;height:30px;border-radius:6px;background:var(--seam);margin:0 auto 28px;box-shadow:0 0 26px rgba(139,92,246,.8)}
h1{font-family:'Archivo',sans-serif;font-weight:700;font-stretch:108%;letter-spacing:-.025em;
   font-size:clamp(2rem,5vw,3.2rem);line-height:1.05;margin:0;max-width:16ch}
p{color:var(--gris);margin:20px auto 0;max-width:46ch}
a{
  display:inline-flex;align-items:center;gap:9px;margin-top:38px;
  padding:15px 28px;border-radius:100px;background:var(--seam);color:#fff;
  text-decoration:none;font-family:'Archivo',sans-serif;font-weight:600;font-size:.86rem;
  letter-spacing:.04em;box-shadow:0 10px 34px -14px rgba(139,92,246,.85);
  transition:transform .4s cubic-bezier(.22,.8,.28,1);
}
a:hover{transform:translateY(-2px)}
</style>
</head>
<body>
  <div>
    <div class="mark"></div>
    <h1>Demande bien reçue.</h1>
    <p>Merci. Nous étudions la compatibilité de votre véhicule et revenons vers vous sous 48 h ouvrées avec un devis détaillé.</p>
    <a href="/">Retour à l'accueil</a>
  </div>
</body>
</html>
