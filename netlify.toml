[build]
  publish = "."

# En-têtes de sécurité et de performance
# Le panneau d'administration ne doit jamais être mis en cache ni indexé
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Les images de la galerie changent de nom quand elles changent : cache long
[[headers]]
  for = "/assets/galerie/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirections : une seule adresse canonique, sans www
[[redirects]]
  from = "https://www.mscustom25.fr/*"
  to = "https://mscustom25.fr/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
